[build-system]
# No compiled extension is built any more (issues.md issues #1, #2,
# #9), so this no longer needs meson/ninja (those were only for
# numpy.f2py) or a C/Fortran compiler.
requires = ["setuptools>=61", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "samos"
version = "0.9.0"
description = "Suite for Analysis of MOlecular Simulations: a set of useful tools to analyze molecular dynamics trajectories"
license = {text = "MIT License"}
authors = [{name = "Leonid Kahle", email = "leonid.kahle@epfl.ch"}]
requires-python = ">=3.10"
dependencies = [
    # 1.21.3 is the first release supporting Python 3.10, which is
    # this package's minimum (requires-python above).
    "numpy>=1.21.3",
    "ase>=3.17.0",
    "scipy>=1.0.0",
    "matplotlib>=2.1.2",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
pre-commit = ["pre-commit", "flake8"]
tests = ["pytest"]
docs = ["Sphinx", "docutils", "sphinx_rtd_theme"]

[project.scripts]
# The dispatcher plus one executable per analysis.  Both spellings run
# the same code: "samos msd ..." is dispatched to "samos-msd ...".
samos = "samos.cli:main"
samos-msd = "samos.cli:main_msd"
samos-vaf = "samos.cli:main_vaf"
samos-vdos = "samos.cli:main_vdos"
samos-rdf = "samos.cli:main_rdf"
samos-adf = "samos.cli:main_adf"

[project.urls]
Homepage = "https://github.com/lekah/samos"

[tool.setuptools.packages.find]
where = ["."]
include = ["samos*"]
namespaces = false

[tool.setuptools.package-data]
"samos.lib" = ["*.f90"]
